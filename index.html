<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEDPUR Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f3a2a">
<link rel="apple-touch-icon" href="medpur-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MEDPUR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first ledger app. Sticky header + ticker, scrolling sections, bottom tab bar, floating + button. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --ink:#23271f; --ink-2:#5a6152; --line:#dfe2d6;
  --green:#6f9a3a; --green-ink:#4d6d26; --green-soft:#e8f0db; --graphite:#3a3d36;
  --red:#b5232f; --red-soft:#f8e3e4; --amber:#a76a10; --amber-soft:#f8ecd6;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:10px; --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171a15; --surface:#20241d; --ink:#e9ecdf; --ink-2:#a3aa96; --line:#33392d;
  --green:#97c25e; --green-ink:#b4d684; --green-soft:#28331d; --graphite:#c9cdbf;
  --red:#ef6b72; --red-soft:#3a1e20; --amber:#e3a94a; --amber-soft:#3a2d16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a15; --surface:#20241d; --ink:#e9ecdf; --ink-2:#a3aa96; --line:#33392d;
  --green:#97c25e; --green-ink:#b4d684; --green-soft:#28331d; --graphite:#c9cdbf;
  --red:#ef6b72; --red-soft:#3a1e20; --amber:#e3a94a; --amber-soft:#3a2d16; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.logo-chip{background:#fff;border-radius:8px;padding:3px 6px;display:flex}
.logo-chip img{height:30px;width:auto}
header.top h1{font-family:var(--display);font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:36px;min-width:36px;padding:0 10px;cursor:pointer}
.ticker{display:flex;gap:16px;align-items:baseline;font-size:13px;color:var(--ink-2);padding-block:6px;border-top:1px solid var(--line);flex-wrap:wrap}
.ticker b{font-family:var(--display);color:var(--ink);font-size:14px}
.ticker .stale{color:var(--amber)}
main{padding-bottom:calc(var(--tabh) + 90px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px}
h2{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 0;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.capital .total{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.01em}
.capital .total small{font-size:14px;color:var(--ink-2);font-weight:600;margin-left:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:10px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kv .neg{color:var(--red)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid transparent}
.alert.crit{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.alert.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.alert.ok{background:var(--green-soft);color:var(--green-ink)}
.alert .tag{font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--surface);white-space:nowrap}
.alert.crit .tag{color:var(--red)} .alert.warn .tag{color:var(--amber)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lbl{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .val{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chg{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.up{color:var(--green-ink)} .down{color:var(--red)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--green-soft) 50%,transparent)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink-2)}
.row .amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.green{background:var(--green-soft);color:var(--green-ink)}
details.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.month>summary{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;cursor:pointer;font-weight:700;list-style:none;font-family:var(--display)}
details.month>summary::-webkit-details-marker{display:none}
details.month>summary::before{content:"▸";margin-right:6px;color:var(--ink-2)}
details.month[open]>summary::before{content:"▾"}
details.month>summary .num{font-weight:600;color:var(--ink-2)}
details.month .row:first-child{border-top:1px solid var(--line)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--graphite);color:var(--bg)}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.golink{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}dt.golink::after{content:" ›"}
.chqrow{flex-wrap:wrap;cursor:default}.chqrow .actions{flex-basis:100%}.chqrow .actions .btn{padding:9px 12px}.chqrow .warnbox{flex-basis:100%}
.seg button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg:has(> :nth-child(4)) button{font-size:13.5px;padding:8px 3px;letter-spacing:-.01em}
.balbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}.balbox b{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right}
.empty{color:var(--ink-2);text-align:center;padding:22px 14px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--green-ink)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(15,18,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{font-family:var(--display);font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.line .full{grid-column:1/-1}
.line .info{font-size:12.5px;color:var(--ink-2)}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--graphite);color:var(--bg)}
.btn.primary{background:var(--green);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.row:focus-visible,.icon-btn:focus-visible,nav.tabs button:focus-visible,.fab:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 60%,transparent);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.err{background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}
.warnbox{background:var(--red);color:#fff;border-radius:10px;padding:14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.total-line{display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:18px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu .btn{padding:16px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 86px + env(safe-area-inset-bottom,0px));background:var(--graphite);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-weight:600;font-size:14px;max-width:90%}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lock .box{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:300px;text-align:center}
.pin-dots{display:flex;gap:12px}.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--graphite)}.pin-dots i.f{background:var(--graphite)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.keypad button{height:58px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-family:var(--display);cursor:pointer}
.mini{font-size:12.5px;color:var(--ink-2)}
table.mov{width:100%;border-collapse:collapse;font-size:13.5px}
table.mov td,table.mov th{padding:7px 8px;border-top:1px solid var(--line);text-align:left}
table.mov th{color:var(--ink-2);font-weight:600;font-size:12px}
table.mov .r{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
@media (min-width:900px){
  nav.tabs{top:0;bottom:0;right:auto;width:200px;border-top:0;border-right:1px solid var(--line);padding-top:80px}
  nav.tabs .in{grid-template-columns:1fr;height:auto;gap:4px;padding:8px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px;font-size:14px;border-radius:8px}
  nav.tabs button.on{background:var(--green-soft)}
  body{padding-left:200px}
  main{padding-bottom:110px}
  .fab{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2.0 Home ===== */
:root{--brand:#68C62F;--brand-ink:#3f7d18;--brand-soft:#eaf7de}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand-ink:#9ddc6a;--brand-soft:#223319}}
/* ===== v2.1 New BL + BL issued ===== */
.sheet:has(> .nb){max-height:100%;height:100%;border-radius:0;padding:0;display:flex;flex-direction:column}
@media (min-width:700px){.sheet:has(> .nb){height:92%;border-radius:16px;overflow:auto}}
.nb{display:flex;flex-direction:column;min-height:100%}
.nb-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.nb-top b{flex:1;font-size:18px}
.nb-top input[type=date]{width:auto;max-width:150px;padding:6px 8px;font-size:14px}
.nb-body{flex:1;padding:14px 16px 18px;display:flex;flex-direction:column;gap:16px}
.nb-lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-bottom:6px}
.nb-lab span{color:var(--brand-ink)}
.nb input:not([type=checkbox]){width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.nb-cust{position:relative}
.nb-cust input.sel{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.nb-dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:5;max-height:320px;overflow:auto}
.nb-dd:empty{display:none}
.nb-dd button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:46px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.nb-dd button:last-child{border-bottom:0}
.nb-dd small{color:var(--ink-2);white-space:nowrap}
.nb-dd .new{color:var(--brand-ink);font-weight:700}
.nb-owe{font-size:13px;color:var(--ink-2);margin-top:6px}
.nb-owe.warn{color:var(--amber);font-weight:700}.nb-owe.over{color:var(--red);font-weight:700}
.nb-empty{color:var(--ink-2);font-size:14px;padding:6px 2px 10px}
.nb-line{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.nb-line .t,.nbp-row .t{flex:1;min-width:0}
.nb-line .t b,.nbp-row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-line .t small{color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.nb input.nb-price{width:92px;flex:none;padding:5px 7px;font-size:15px;text-align:right}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.stp button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.nb .stp input{width:54px;text-align:center;padding:7px 2px}
.nb-add{width:100%}
.nb-pay{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.nb-tog{display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer;min-height:32px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw:checked{background:var(--brand)}.sw:checked::after{left:21px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.nb-bar{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:3}
.nb-bar .tt{flex:1;min-width:0}.nb-bar small{display:block;color:var(--ink-2);font-size:12px}.nb-bar b{font-size:20px}
.nb-bar .btn{min-width:130px;min-height:48px;background:var(--brand);color:#fff}
.nbp-search{padding:10px 16px;background:var(--bg);position:sticky;top:57px;z-index:2}
.nbp-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.nbp-row.on{background:var(--brand-soft)}
.nbp-row small{display:block;color:var(--ink-2);font-size:13px;margin-top:3px}
.nbp-row .lo{color:var(--red);font-weight:700}
.nbp .nb-bar b{font-size:16px}
.nbi-c{text-align:center;padding:26px 16px 8px}
.nbi-ok{width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.nbi-no{color:var(--ink-2);margin-top:12px;font-weight:600}
.nbi-amt{font-size:34px;font-weight:800;margin:6px 0 2px;overflow-wrap:anywhere}.nbi-amt span{font-size:16px;color:var(--ink-2)}
.nbi-who{font-weight:600}
.nbi-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px}
.nbi-tiles>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;min-width:0}
.nbi-tiles small{display:block;font-size:12px;color:var(--ink-2)}.nbi-tiles b{display:block;margin-top:4px;font-size:15px;overflow-wrap:anywhere}
.nbi-tiles .due{background:var(--amber-soft);border-color:transparent}.nbi-tiles .due b{color:var(--amber)}
.nbi-act{padding:4px 16px;display:flex;flex-direction:column;gap:10px}
.nbi-act .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;font-size:16px}
.btn.wa{background:#25D366;color:#fff}
.btn.pdf{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.nbi-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));margin-top:auto}
.btn.txt{background:none;color:var(--ink);text-decoration:underline;padding:12px 4px}
.btn.ogreen{background:transparent;border:1.5px solid var(--brand);color:var(--brand-ink);min-width:130px}
:root[data-theme="dark"]{--brand-ink:#9ddc6a;--brand-soft:#223319}
header.top.home .wrap{padding-block:6px}
.brand-chip{background:#fff;border-radius:8px;padding:2px 6px;display:flex;margin-right:auto}
.brand-chip img{height:40px;width:auto;display:block}
.icon-btn.gear{display:flex;align-items:center;justify-content:center;padding:0;width:40px;height:40px}
.icon-btn.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.ticker.tkh{display:flex;flex:1;min-width:0;flex-wrap:nowrap;gap:0;align-items:center;padding:0;border-top:1px solid var(--line)}
.tk-half{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 4px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.tk-half b{font-family:var(--display);font-size:14px;color:var(--ink)}
.tk-half .num{color:var(--ink);font-weight:600}
.tk-half.stale .num{color:var(--amber)}
.tk-div{width:1px;align-self:stretch;background:var(--line);margin:6px 0}
.tk-ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none}
.tk-ic.eur{color:#2b6fd6}.tk-ic.gold{color:#d49a12}
.ar{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;flex:none}
.ar.up{color:var(--green-ink)}.ar.down{color:var(--red)}
.upd{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:35;text-align:center;font-size:12px;font-weight:600;padding:4px 0;background:var(--graphite);color:var(--bg);transform:translateY(-120%);transition:transform .2s}
.upd.show{transform:none}
.hero{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);border-radius:14px;padding:14px;color:var(--brand-ink)}
.hero .hl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero .hv{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.1;margin:2px 0 12px;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero .hv small{font-size:14px;font-weight:700;margin-left:5px}
.hbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hbox>div{background:#fff;color:#23271f;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.hbox span{font-size:12px;color:#5a6152}
.hbox b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.alert.arow{width:100%;text-align:left;cursor:pointer;align-items:center;font:inherit;color:inherit;font-size:14px}
.alert .atx{flex:1;min-width:0;overflow-wrap:anywhere}
.chev{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;opacity:.55;flex:none}
.more{align-self:flex-start;background:none;border:0;color:var(--ink-2);font-weight:700;padding:11px 8px;min-height:44px;cursor:pointer;font-size:14px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles3 .tile{padding:10px 9px}
.tiles3 .tile .lbl{font-size:11px;letter-spacing:.03em}
.tiles3 .tile .val{font-size:15px;line-height:1.2}
.tiles3 .chg{font-weight:700}
.capt{font-size:12px;color:var(--ink-2);margin-top:-6px}
details.hbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.hbar>summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none;font-weight:700}
details.hbar>summary::-webkit-details-marker{display:none}
details.hbar .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none}
details.hbar.owe .ic{color:var(--green-ink)}details.hbar.iowe .ic{color:var(--red)}
details.hbar .lb{flex:1}
details.hbar summary b{font-family:var(--display);font-variant-numeric:tabular-nums}
details.hbar .chev{transition:transform .15s}
details.hbar[open] .chev{transform:rotate(90deg)}
details.hbar .list{border:0;border-top:1px solid var(--line);border-radius:0}
.sc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sc-head h2{margin:0}
.sc-head .mini{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:132px;align-items:end;margin-top:12px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;border:0;background:none;padding:0;cursor:pointer}
.bar i{display:block;width:100%;max-width:40px;border-radius:6px 6px 2px 2px;background:#c4c8bb;min-height:2px}
.bar.cur i{background:var(--brand)}
.bar.sel i{outline:2px solid var(--graphite);outline-offset:1px}
.bar span{font-size:11.5px;color:var(--ink-2)}
.fab.hm{background:var(--brand);z-index:24;transition:transform .2s}
.fab.hm.open{transform:rotate(45deg)}
.dim{position:fixed;inset:0;background:rgba(15,18,12,.5);z-index:22;opacity:0;pointer-events:none;transition:opacity .15s}
.dim.on{opacity:1;pointer-events:auto}
.fabmenu{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + 16px + 58px + 14px + env(safe-area-inset-bottom,0px));z-index:23;display:flex;flex-direction:column;gap:10px;align-items:flex-end;visibility:hidden;opacity:0;transform:translateY(8px);transition:opacity .15s,transform .15s,visibility .15s}
.fabmenu.on{visibility:visible;opacity:1;transform:none}
.fabmenu button{display:flex;align-items:center;gap:10px;border:0;background:var(--surface);color:var(--ink);padding:8px 18px 8px 8px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.2);cursor:pointer}
.fabmenu i{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.fabmenu i svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2}
@media (min-width:900px){.fabmenu{bottom:calc(24px + 58px + 14px)}}
</style>

/* Finance Tracker engine — pure logic, no DOM. Money in integer cents, quantities in integer milli-units.
   Stock is kept as (Q milli-units, V cents); CMUP = V/Q at full precision. One shared function per calculation. */
const Engine = (() => {
  'use strict';
  class TrackerError extends Error {}
  const fail = (m) => { throw new TrackerError(m); };

  // ---------- parsing & rounding (R01, R02) ----------

  if (!/^-?\d+(\.\d+)?$/.test(s)) fail(`${label || 'Value'} is not a valid number`);
    const neg = s[0] === '-'; if (neg) s = s.slice(1);
    let [ip, fp = ''] = s.split('.');
    fp = (fp + '0'.repeat(d + 1)).slice(0, d + 1);
    let n = Number(ip) * 10 ** d + Number(fp.slice(0, d) || 0);
    if (Number(fp[d]) >= 5) n += 1;
    if (!Number.isSafeInteger(n)) fail(`${label || 'Value'} is too large`);

  }

  const toMilli = (v, label = 'Quantity') => parseFixed(v, 3, label);

function trendSVG(rows, label) {
  const W = 360, H = 170, L = 38, R = 8, T = 10, B = 22;
  const val = (c) => c / 100;
  const all = rows.flatMap((r) => [r.sales, r.purchases, r.profit, r.salesLY]).map(val);
  const max = Math.max(1, ...all), min = Math.min(0, ...all);
  const X = (i) => L + ((W - L - R) * (i + 0.5)) / 12, Y = (v) => T + ((H - T - B) * (max - v)) / (max - min);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = min + ((max - min) * i) / 4; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L - 4}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${short(v)}</text>`; }
  const line = (k, col, dash, w) => `<polyline fill="none" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''} points="${rows.map((r, i) => `${X(i).toFixed(1)},${Y(val(r[k])).toFixed(1)}`).join(' ')}"/>`;
  const bars = rows.map((r, i) => { const v = val(r.profit), y0 = Y(0), y1 = Y(v); return `<rect x="${(X(i) - 5).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="10" height="${Math.max(0.5, Math.abs(y1 - y0)).toFixed(1)}" fill="${v < 0 ? 'var(--red)' : 'var(--green-soft)'}" stroke="${v < 0 ? 'var(--red)' : 'var(--green-ink)'}" stroke-width=".8"/>`; }).join('');
  const xl = rows.map((r, i) => `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${MONTHS[i][0]}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${bars}${line('salesLY', 'var(--ink-2)', '3 3', 1.5)}${line('purchases', 'var(--graphite)', '', 1.8)}${line('sales', 'var(--green)', '', 2.6)}${xl}</svg></div>

}

function stmtRows(kind, id, from, to, lang = 'en') {
  const r = E.statement(data, kind, id, from, to), L = STL[lang], out = [];

function nbLastPrice(cid, itemId) {

}

}
function nbTotal() { let t = 0; for (const id of nbSel()) { const c = nbLineC(id); if (c) t += c; } return t; }
function nbSetQty(id, v) {

  const cols = [{ t: 'Date', x: 17 }, { t: 'Pièce', x: 40 }, { t: 'Détail', x: 70 }, { t: 'Débit', x: 135, a: 'right' }, { t: 'Crédit', x: 160, a: 'right' }, { t: 'Solde', x: 193, a: 'right' }];
  const head = (first) => { letterhead(doc, 'RELEVÉ DE COMPTE', [kind === 'c' ? 'Client' : 'Fournisseur', `Du ${dmy(from)} au ${dmy(to)}`]); let y = 44; if (first) y = partyBox(doc, kind === 'c' ? 'Client' : 'Fournisseur', p, y) + 8; return tableHead(doc, y, cols); };
  let y = head(true); doc.setFontSize(9);
  const line = (d, ref, lbl, delta, bal, bold) => {
    if (y > 270) { doc.addPage(); y = head(false); doc.setFontSize(9); }
    doc.setFont('helvetica', bold ? 'bold' : 'normal');
    doc.text(d, 17, y + 5.4); doc.text(ref || '', 40, y + 5.4); doc.text(doc.splitTextToSize(lbl, 62)[0], 70, y + 5.4);
    if (delta) { const debit = kind === 'c' ? delta > 0 : delta < 0; const a = fr(Math.abs(delta)); doc.text(debit ? a : '', 135, y + 5.4, { align: 'right' }); doc.text(debit ? '' : a, 160, y + 5.4, { align: 'right' }); }
    doc.text(fr(bal), 193, y + 5.4, { align: 'right' });
    doc.setDrawColor(220, 224, 210); doc.setLineWidth(0.2); doc.line(15, y + 8, 195, y + 8); y += 8;
  };
  line('', '', "Solde d'ouverture", 0, r.opening, true);
  for (const x of r.rows) line(dmy(x.date), x.ref, x.label, x.delta, x.balance, false);
  line('', '', 'Solde de clôture', 0, r.closing, true);
  y += 6; doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.text(`${kind === 'c' ? 'Montant dû par le client' : 'Montant dû au fournisseur'} : ${fr(r.closing)} MAD`, 195, y + 4, { align: 'right' });
  footers(doc, `Relevé — ${p.name} — ${dmy(from)} au ${dmy(to)}`);
  return { doc, name: `releve-${E.norm(p.name).replace(/\W+/g, '-')}-${from}_${to}.pdf` };
}
function reportDoc(mo) {
  const rep = E.monthReport(data, mo), c = rep.compare, t = rep.totals, cap = rep.capital, doc = newDoc(), fm = E.fmtApp;
  const ch = (x) => (x.pct === null ? '-' : `${x.diff >= 0 ? '+' : ''}${fm(x.diff)} (${x.pct >= 0 ? '+' : ''}${x.pct.toFixed(1)}%)`);
  letterhead(doc, 'MONTHLY REPORT', [mLabel(mo), 'Amounts in MAD, VAT included']);
  let y = tableHead(doc, 46, [{ t: 'Metric', x: 17 }, { t: 'Value', x: 85, a: 'right' }, { t: 'vs previous month', x: 140, a: 'right' }, { t: 'vs same month last year', x: 193, a: 'right' }]);
  doc.setFontSize(9);
  const row = (lbl, k, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(lbl, 17, y + 5.4); doc.text(fm(c[k].value), 85, y + 5.4, { align: 'right' }); doc.text(ch(c[k].vsPrev), 140, y + 5.4, { align: 'right' }); doc.text(ch(c[k].vsLastYear), 193, y + 5.4, { align: 'right' }); doc.setDrawColor(220, 224, 210); doc.line(15, y + 8, 195, y + 8); y += 8; };
  row('Sales', 'sales'); row('Purchases', 'purchases'); row('Business expenses', 'biz'); row('Personal expenses', 'pers'); row('Margin', 'margin');
  doc.setFont('helvetica', 'normal'); doc.text('Stock adjustments', 17, y + 5.4); doc.text(fm(t.adj), 85, y + 5.4, { align: 'right' }); doc.line(15, y + 8, 195, y + 8); y += 8;
  row('Net profit', 'profit', true);
  if (t.below) { doc.setTextColor(181, 35, 47); doc.text(`Loss on below-cost sales: ${fm(t.below)}`, 17, y + 6); doc.setTextColor(0); y += 8; }
  y += 6; doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Position at month end', 15, y); y += 3; doc.setFontSize(9);
  [['Capital', cap.total], ['Cash', cap.cash], ['Bank', cap.bank], ['Cheques & effets pending', cap.pending], ['Cheques & effets to pay', -cap.toPay], ['Stock value', cap.stock], ['Customers owe', cap.customersOwe], ['Suppliers owed', cap.suppliersOwed]].forEach(([l, v]) => { doc.setFont('helvetica', 'normal'); doc.text(l, 17, y + 5.4); doc.text(fm(v), 85, y + 5.4, { align: 'right' }); y += 6; });
  y += 6; doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(`Yearly trend ${mo.slice(0, 4)}`, 15, y); y += 3;
  y = tableHead(doc, y, [{ t: 'Month', x: 17 }, { t: 'Sales', x: 70, a: 'right' }, { t: 'Purchases', x: 105, a: 'right' }, { t: 'Net profit', x: 140, a: 'right' }, { t: 'Sales last year', x: 193, a: 'right' }]);
  doc.setFontSize(9);
  E.yearTrend(data, mo.slice(0, 4)).forEach((r, i) => { doc.setFont('helvetica', 'normal'); doc.text(MONTHS[i], 17, y + 5.4); doc.text(fm(r.sales), 70, y + 5.4, { align: 'right' }); doc.text(fm(r.purchases), 105, y + 5.4, { align: 'right' }); doc.text(fm(r.profit), 140, y + 5.4, { align: 'right' }); doc.text(fm(r.salesLY), 193, y + 5.4, { align: 'right' }); doc.setDrawColor(230, 233, 222); doc.line(15, y + 7, 195, y + 7); y += 7; });
  footers(doc, `Report ${mo}`);
  return { doc, name: `report-${mo}.pdf` };
}
const blobOf = (o) => o.doc.output('blob');

// ---------- share (R18) ----------
async function sharePDF(o, phone, text) {
  const blob = blobOf(o), file = new File([blob], o.name, { type: 'application/pdf' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text || '' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  download(blob, o.name);
  const wa = E.waLink(phone);
  if (wa) window.open(`${wa}?text=${encodeURIComponent(text || '')}`, '_blank', 'noopener');
  else toast('PDF downloaded. Attach it in WhatsApp.');
}
function safe(fn) { try { return fn(); } catch (e) { console.error(e); toast(e.message); return null; } }
A.blpdf = (el) => { const o = safe(() => blDoc(el.dataset.id)); if (o) download(blobOf(o), o.name); };
A.blshare = (el) => { const o = safe(() => blDoc(el.dataset.id)); if (!o) return; const sale = st().sales[el.dataset.id], c = cust(sale.customerId), ev = data.events.find((e) => e.id === el.dataset.id); sharePDF(o, c.phone, `Bonjour, voici le bon de livraison ${ev.number} — ${E.fmtFr(sale.totalC)} MAD. Merci.`); };
A.stmtpdf = (el) => { const o = safe(() => stmtDoc(el.dataset.k, el.dataset.id, fv('from'), fv('to'))); if (o) download(blobOf(o), o.name); };
A.stmtshare = (el) => { const o = safe(() => stmtDoc(el.dataset.k, el.dataset.id, fv('from'), fv('to'))); if (!o) return; const p = (el.dataset.k === 'c' ? cust : supp)(el.dataset.id); sharePDF(o, p.phone, `Bonjour, voici votre relevé de compte du ${dmy(fv('from'))} au ${dmy(fv('to'))}.`); };
A.reppdf = (el) => { const o = safe(() => reportDoc(ui.rmonth)); if (!o) return; if (el.dataset.share) sharePDF(o, '', `Report ${mLabel(ui.rmonth)}`); else download(blobOf(o), o.name); };
